name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Release version: the tag without its "v"; other builds use the run number. Not named VERSION:
  # MSBuild reads environment variables as properties, and Version=v1.2.0 breaks NuGet restore.
  RK_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.{0}', github.run_number) }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Version
        id: ver
        shell: pwsh
        run: |
          "version=$($env:RK_VERSION.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Build native kernels
        shell: bash
        run: sh native/build.sh

      - name: Run tests
        run: dotnet test tests/RecoverKit.Tests -c Release

      - uses: actions/cache@v4
        with:
          path: installer/cache
          key: hashcat-win-${{ hashFiles('installer/build.ps1') }}

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Build portable archive
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          # The marker keeps settings and data in .\userdata and runs the bundled hashcat in place.
          Set-Content installer/stage/portable 'RecoverKit portable version: settings and data are kept in the userdata folder next to RecoverKit.exe.'
          Compress-Archive -Path installer/stage/* -DestinationPath "installer/out/RecoverKit-$v-x64-portable.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            installer/out/*.msi
            installer/out/*.zip

  macos:
    runs-on: macos-15   # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Version
        id: ver
        run: echo "version=${RK_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build native kernels
        run: sh native/build.sh

      - name: Run tests
        run: dotnet test tests/RecoverKit.Tests -c Release

      # hashcat has no official macOS build: compile the pinned release with its Metal backend.
      - name: Cache hashcat build
        uses: actions/cache@v4
        with:
          path: macos/out/hashcat
          key: hashcat-macos-arm64-${{ hashFiles('macos/build-hashcat.sh') }}

      - name: Build hashcat
        run: sh macos/build-hashcat.sh

      - name: Build app and disk image
        run: |
          python -m pip install dmgbuild==1.6.7
          PYTHON=python sh macos/package.sh ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            macos/out/*.dmg
            macos/out/*.dmg.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job publishes
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      # Release notes: this version's section of CHANGELOG.md, with wrapped lines joined (release
      # pages keep line breaks), plus a compare link to the previous tag.
      - name: Release notes
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            /^## \[/ { on = index($0, "## [" v "]") == 1; next }
            /^\[[0-9]/ { on = 0 }
            on { print }
          ' CHANGELOG.md | perl -0pe 's/\n  (?=\S)/ /g; s/^\s+|\s+$//g' > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $ver" >&2; exit 1; fi
          prev=$(git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY" 'v*' | sed 's#.*refs/tags/##' \
            | sort -V | awk -v t="$GITHUB_REF_NAME" '$0 == t { print p; exit } { p = $0 }')
          if [ -n "$prev" ]; then
            printf '\n\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.dmg.sha256
          body_path: notes.md
