name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -like 'refs/tags/v*') { $v = '${{ github.ref_name }}'.Substring(1) }
          else { $v = '0.0.${{ github.run_number }}' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build native kernels
        shell: bash
        run: sh native/build.sh

      - name: Run tests
        run: dotnet test tests/RecoverKit.Tests -c Release

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Build portable archive
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Compress-Archive -Path installer/stage/* -DestinationPath "installer/out/RecoverKit-$v-x64-portable.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: RecoverKit-${{ steps.ver.outputs.version }}
          path: |
            installer/out/*.msi
            installer/out/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/out/*.msi
            installer/out/*.zip
          generate_release_notes: true
