name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Release version: the tag without its "v"; other builds use the run number.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.0.{0}', github.run_number) }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Version
        id: ver
        shell: pwsh
        run: |
          "version=$($env:VERSION.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Build native kernels
        shell: bash
        run: sh native/build.sh

      - name: Run tests
        run: dotnet test tests/RecoverKit.Tests -c Release

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Build portable archive
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Compress-Archive -Path installer/stage/* -DestinationPath "installer/out/RecoverKit-$v-x64-portable.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            installer/out/*.msi
            installer/out/*.zip

  macos:
    runs-on: macos-15   # Apple silicon (arm64)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Version
        id: ver
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build native kernels
        run: sh native/build.sh

      - name: Run tests
        run: dotnet test tests/RecoverKit.Tests -c Release

      # hashcat has no official macOS build: compile the pinned release with its Metal backend.
      - name: Cache hashcat build
        uses: actions/cache@v4
        with:
          path: macos/out/hashcat
          key: hashcat-macos-arm64-${{ hashFiles('macos/build-hashcat.sh') }}

      - name: Build hashcat
        run: sh macos/build-hashcat.sh

      - name: Build app and disk image
        run: |
          python -m pip install dmgbuild==1.6.7
          PYTHON=python sh macos/package.sh ${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            macos/out/*.dmg
            macos/out/*.dmg.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job publishes
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*.msi
            dist/*.zip
            dist/*.dmg
            dist/*.dmg.sha256
          generate_release_notes: true
