# The Stay ZIP attack tests run full key searches and take many minutes, so the normal
# build skips them (see tests/RecoverKit.Tests/RecoverKit.Tests.csproj). They run here only
# when the attack's code or its tests change, or on demand.
name: Stay ZIP attack tests

on:
  push:
    branches: [main]
    paths:
      - 'src/RecoverKit.Core/Attacks/Stay/**'
      - 'src/RecoverKit.Core/Formats/ZipStay*.cs'
      - 'src/RecoverKit.Core/Formats/ZipExtractor.cs'
      - 'tests/RecoverKit.Tests/Stay/**'
      - 'tests/RecoverKit.Tests/StayZipFeatureTests.cs'
      - '.github/workflows/stay-tests.yml'
  pull_request:
    paths:
      - 'src/RecoverKit.Core/Attacks/Stay/**'
      - 'src/RecoverKit.Core/Formats/ZipStay*.cs'
      - 'src/RecoverKit.Core/Formats/ZipExtractor.cs'
      - 'tests/RecoverKit.Tests/Stay/**'
      - 'tests/RecoverKit.Tests/StayZipFeatureTests.cs'
      - '.github/workflows/stay-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  stay:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Build native kernels
        shell: bash
        run: sh native/build.sh

      - name: Run Stay tests
        run: dotnet test tests/RecoverKit.Tests -c Release -p:RunStayTests=true --filter Category=Stay
